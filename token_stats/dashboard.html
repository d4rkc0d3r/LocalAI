<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Stats Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-panel: #171a23;
    --bg-inset: #1d212e;
    --border: #2a2f3f;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #4f8cff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: baseline; justify-content: space-between; }
  h1 small { color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 10px; }

  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { color: var(--text-dim); font-size: 13px; }

  select {
    background: var(--bg-inset);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  .btn-group {
    display: flex;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .btn-group button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    transition: background .12s, color .12s;
  }
  .btn-group button + button { border-left: 1px solid var(--border); }
  .btn-group button:hover { color: var(--text); }
  .btn-group button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  #status { color: var(--text-dim); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
  #status.error { color: #ff6b6b; }

  .main { display: flex; gap: 20px; align-items: stretch; }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .chart-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .summary-panel { width: 340px; flex-shrink: 0; }

  .panel-title { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

  /* Y axis */
  .chart-area { display: flex; flex: 1; min-height: 320px; }
  .y-axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    font-size: 11px;
    color: var(--text-dim);
    padding-right: 8px;
    padding-bottom: 26px; /* align with plot height (leaves room for x labels) */
  }
  .bar-region { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .plot-wrap { flex: 1; min-height: 0; position: relative; }

  .grid-lines {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100%; /* fills the plot area */
    pointer-events: none;
  }
  .grid-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(255, 255, 255, 0.07);
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 100%;
    border-bottom: 1px solid var(--border);
  }

  .bar-group {
    flex: 1;
    min-width: 0;   /* wide ranges (30d / yearly) need thin bars, no minimum */
    max-width: 72px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .bar-stack {
    flex: 1;               /* fill the group minus the 26px x-label so % segments resolve */
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    cursor: default;
  }

  .bar-seg { width: 100%; }

  .bar-seg-group {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;   /* paint above the absolute gridlines, like .bar-stack */
    cursor: default;
  }
  .bar-seg:hover { filter: brightness(1.25); }

  .x-labels {
    height: 26px;
    display: flex;
    gap: 4px; /* same gaps as .bars so labels align with bars */
    padding-top: 4px;
  }
  .x-label {
    flex: 1;
    min-width: 0;
    max-width: 72px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    white-space: nowrap;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    display: none;
    background: #232838;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    max-width: 280px;
  }
  #tooltip .tt-title { font-weight: 600; margin-bottom: 6px; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; margin-top: 3px; }
  #tooltip .tt-row span:first-child { color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  #tooltip .tt-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  #tooltip .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 5px; font-weight: 600; }
  #tooltip .tt-detail { display: flex; justify-content: flex-end; gap: 10px; font-size: 11px; color: var(--text-dim); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  #tooltip .tt-grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; }
  #tooltip .tt-grid .lbl { color: var(--text-dim); }
  #tooltip .tt-grid .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }

  /* Summary list */
  .model-row { margin-bottom: 12px; cursor: pointer; border-left: 2px solid transparent; padding-left: 8px; transition: border-color .12s, background .12s; }
  .model-row:last-child { margin-bottom: 0; }
  .model-row:hover { background: rgba(255,255,255,0.04); }
  .model-row.selected { border-left-color: var(--accent); background: rgba(79,140,255,0.10); }

  .speed-panel { margin-top: 20px; }
  .model-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .model-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .model-bar-track { height: 8px; background: var(--bg-inset); border-radius: 4px; overflow: hidden; }
  .model-bar-fill { height: 100%; border-radius: 4px; }
  .model-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-variant-numeric: tabular-nums; }

  .grand-total {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }
  .grand-total b { font-variant-numeric: tabular-nums; }

  .cache-line {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    cursor: default;
  }
  .cache-line span { color: var(--text-dim); }
  .cache-line b { font-variant-numeric: tabular-nums; }

  /* styled tooltip for metric buttons */
  .tt-text { color: var(--text-dim); line-height: 1.5; max-width: 240px; }

  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }

  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .summary-panel { width: 100%; }
  }
</style>
</head>
<body>

<h1><span>Token Stats <small id="subtitle">loading…</small></span><span id="status"></span></h1>

<div class="controls">
  <div class="control-group">
    <select id="rangeSel">
      <option value="7">Last 7 Days</option>
      <option value="30">Last 30 Days</option>
      <option value="365">Last Year</option>
      <option value="all">Total</option>
    </select>
  </div>
  <div class="control-group">
    <select id="aggSel">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="entries">Days with entry</option>
    </select>
  </div>
  <div class="control-group">
    <div class="btn-group" id="metricBtns" role="group" aria-label="Metric">
      <button type="button" class="active" data-metric="tokens">Tokens</button>
      <button type="button" data-metric="output">Output</button>
      <button type="button" data-metric="requests">Requests</button>
      <button type="button" data-metric="time">Time</button>
      <button type="button" data-metric="luna">Luna equiv. $</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="panel chart-panel">
    <div class="panel-title" id="chartTitle">Daily Usage</div>
    <div class="chart-area">
      <div class="y-axis" id="yAxis"></div>
      <div class="bar-region">
        <div class="plot-wrap">
          <div class="bars" id="bars"></div>
        </div>
        <div class="x-labels" id="xLabels"></div>
      </div>
    </div>
  </div>

  <div class="panel summary-panel">
    <div class="panel-title" id="summaryTitle">Per Model</div>
    <div id="modelList"></div>
    <div class="grand-total" id="grandTotal" hidden>
      <span>Total</span><b id="grandValue"></b>
    </div>
    <div class="cache-line" id="cacheLine" hidden>
      <span>Cache Hit %</span><b id="cacheValue"></b>
    </div>
  </div>

  </div>
</div>

<div class="panel chart-panel speed-panel" id="speedPanel">
    <div class="controls" style="margin-bottom:14px">
      <div class="control-group">
        <select id="speedModelSel"></select>
      </div>
      <div class="control-group">
        <div class="btn-group" id="speedBtns" role="group" aria-label="Speed mode">
          <button type="button" class="active" data-speed="output">Output tps</button>
          <button type="button" data-speed="prompt">Prefill tps</button>
          <button type="button" data-speed="cache">Cache Hit %</button>
          <button type="button" data-speed="ot">Output time %</button>
        </div>
      </div>
    </div>
    <div class="chart-area">
      <div class="y-axis" id="speedYAxis"></div>
      <div class="bar-region">
        <div class="plot-wrap">
          <div class="bars" id="speedBars"></div>
        </div>
        <div class="x-labels" id="speedXLabels"></div>
      </div>
    </div>
</div>

<div id="tooltip"></div>

<script>
"use strict";

const DATA_FILE = "parsed_request_stats.md";

const MODEL_COLORS = [
  "#4f8cff", "#3ddc97", "#ffa94d", "#e599f7",
  "#ff6b9d", "#4dd0e1", "#ffca28", "#a1887f"
];
const FALLBACK_COLOR = "#5c6370";

/* ---------- state ---------- */
let records = [];           // parsed rows: {model, cached, input, output, date}
let models = [];            // unique model names
let modelColor = {};        // model -> color
let metric = "tokens";      // currently active metric button
let speedRecs = [];         // range-filtered records for the selected speed model
let speedModel = null;        // model selected via the right panel (or dropdown)
let speedMetric = "output";   // "output" | "prompt" | "cache" | "ot"
let aggMode = "daily";        // "daily" | "weekly" | "monthly" | "entries" (days that have entries)

/* ---------- helpers ---------- */
const fmt = n => n.toLocaleString("en-US");

// Luna pricing, USD per MTok (1e6 tokens)
const LUNA = { cached: 0.01, input: 0.10, output: 0.50 };
const MTOK = 1e6;

function metricLabel(m) {
  return { tokens: "Tokens", output: "Output Tokens", requests: "Requests", time: "Time", luna: "Luna equiv. $" }[m];
}

function metricOf(r, m) {
  if (m === "requests") return 1;
  if (m === "time") return r.promptMs + r.outputMs;
  if (m === "output") return r.output;
  if (m === "luna") return (r.cached * LUNA.cached + r.input * LUNA.input + r.output * LUNA.output) / MTOK;
  return r.cached + r.input + r.output;
}

function isCurrency(m) { return m === "luna"; }

// Format a metric value appropriately (currency / time / plain number)
function fmtValue(m, v) {
  if (isCurrency(m)) return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (m === "time")  return fmtHms(v);
  return fmt(v);
}

function compactValue(m, n, top) {
  if (isCurrency(m)) return "$" + compactMoney(n);
  if (m === "time")  return compactHms(n, top < 5 * 3600000);
  return compact(n);
}

// Compact duration label for axis ticks: 2h / 45m / 30s
// When the axis top is under 5h, include minutes: 1h 15m / 4h 30m
function compactHms(n, precise) {
  const s = Math.round(n / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return precise ? h + "h " + m + "m" : h + "h";
  if (m > 0) return m + "m";
  return s + "s";
}

// Compact currency with sane precision for axis labels
function compactMoney(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  if (n >= 100) return String(Math.round(n));
  return n.toFixed(2);
}

function dayKey(d) {           // "YYYY-MM-DD" from a "YYYY-MM-DD HH:MM:SS.mmm" string
  return String(d).slice(0, 10);
}

function shortDay(day) {       // "2026-10-08" -> "Oct 08"
  const [y, m, d] = day.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[+m - 1] + " " + d;
}

function monthName(day) {      // "2026-10-08" -> "Oct"
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+day.slice(5, 7) - 1];
}

// For yearly range: one slot per available month — the day closest to its 15th
function monthMidLabels(days) {
  const best = {};
  for (const day of days) {
    const ym = day.slice(0, 7);
    const dist = Math.abs(+day.slice(8) - 15);
    const b = best[ym];
    if (!b || dist < b.dist) best[ym] = { day, dist };
  }
  const out = {};
  for (const ym in best) out[best[ym].day] = monthName(ym + "-01");
  return out;
}

// ---------- aggregation buckets ----------
// Calendar day -> bucket key for the active aggregation: days (daily/entries),
// the week's Monday (weekly), or "YYYY-MM" (monthly)
function bucketKeyForDay(day, mode) {
  if (mode === "monthly") return day.slice(0, 7);
  if (mode === "weekly") {
    const d = new Date(day + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // Mon = start of week
    return localDay(d);
  }
  return day;
}

function bucketTitle(key) {        // human text for a bucket (tooltip titles, subtitle)
  if (aggMode === "monthly") return monthName(key) + " " + key.slice(0, 4);
  if (aggMode === "weekly") {       // key is the Monday; show the whole week "Oct 05 – Oct 11"
    const end = new Date(key + "T00:00:00");
    end.setDate(end.getDate() + 6);
    return shortDay(key) + " – " + shortDay(localDay(end));
  }
  return shortDay(key);
}

function aggTitle() {             // chart title prefix, e.g. "Weekly Tokens"
  return { daily: "Daily", weekly: "Weekly", monthly: "Monthly", entries: "Days with entry" }[aggMode];
}

// X-axis label per bucket; dense charts are thinned:
// weekly -> ~8 week labels; monthly -> month names (year if multi-year);
// daily/entries 30d -> every 3rd day; 365 -> month name near the 15th
function buildAxisLabels(keys) {
  const out = {};
  if (aggMode === "weekly") {
    const every = Math.max(1, Math.ceil(keys.length / 8));
    keys.forEach((k, i) => { if (i % every === 0) out[k] = shortDay(k); });
    return out;
  }
  if (aggMode === "monthly") {
    const multiYear = new Set(keys.map(k => k.slice(0, 4))).size > 1;
    for (const k of keys) out[k] = monthName(k) + (multiYear ? " " + k.slice(2, 4) : "");
    return out;
  }
  const range = document.getElementById("rangeSel").value;
  if (range === "365") return monthMidLabels(keys);
  if (range === "30") { for (const k of keys) if (+k.slice(8) % 3 === 0) out[k] = shortDay(k); return out; }
  for (const k of keys) out[k] = shortDay(k);
  return out;
}

/* ---------- data loading ---------- */
function parseMarkdown(md) {
  const rows = [];
  let header = null;
  for (const line of md.split(/\r?\n/)) {
    const t = line.trim();
    if (!t.startsWith("|")) continue;
    const cells = t.split("|").slice(1, -1).map(c => c.trim());
    if (cells[1] === "---" || /^-+$/.test(cells[1])) continue;   // separator
    if (!header) { header = cells; continue; }
    const rec = {};
    header.forEach((h, i) => rec[h.toLowerCase().replace(/\s+/g, "_")] = cells[i]);
    const date = rec.date;
    if (!date || !/^\d{4}-\d{2}-\d{2}/.test(date)) continue;
    rows.push({
      model: rec.model || "unknown",
      cached: parseInt(rec.cached, 10) || 0,
      input: parseInt(rec.input, 10) || 0,
      output: parseInt(rec.output, 10) || 0,
      promptMs: parseFloat(rec.prompt_ms) || 0,
      outputMs: parseFloat(rec.output_ms) || 0,
      date,
      day: dayKey(date)
    });
  }
  return rows;
}

async function loadData() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(DATA_FILE, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    records = parseMarkdown(await res.text());
    status.classList.remove("error");
    status.textContent = fmt(records.length) + " requests loaded";
    if (!records.length) throw new Error("no rows parsed");
    render();
  } catch (e) {
    status.classList.add("error");
    status.textContent = "Failed to load " + DATA_FILE + " — serve this folder over http " +
      "(e.g. python -m http.server) and reload. (" + e.message + ")";
  }
}

/* ---------- range / aggregation ---------- */
function localDay(d) {        // "YYYY-MM-DD" in local time (toISOString would drift across timezones)
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function rangeStartDay(range) {
  if (range === "all") return null;
  // calendar mode anchors on today
  const anchor = localDay(new Date());
  const d = new Date(anchor + "T00:00:00");
  d.setDate(d.getDate() - (parseInt(range, 10) - 1));
  return localDay(d);
}

// "Only days with data" mode: the latest X distinct days that have entries
function rangeStartDataDay(range) {
  const days = [...new Set(records.map(r => r.day))].sort();
  return days[Math.max(0, days.length - parseInt(range, 10))];
}

// The X calendar days the window covers (ending today); null for "all".
function dayListForRange(range) {
  if (range === "all") return null;
  const out = [];
  const end = new Date(localDay(new Date()) + "T00:00:00");
  for (let i = parseInt(range, 10) - 1; i >= 0; i--) {
    const d = new Date(end);
    d.setDate(d.getDate() - i);
    out.push(localDay(d));
  }
  return out;
}

// Bucket keys covering the window (so gaps draw as empty bars). null for
// "all" and "entries" — those are derived from the data itself.
function bucketListForRange(range) {
  if (range === "all" || aggMode === "entries") return null;
  if (aggMode === "daily") return dayListForRange(range);
  const start = rangeStartDay(range);
  const today = localDay(new Date());
  const out = [];
  let last = null;
  const d = new Date(start + "T00:00:00");
  while (localDay(d) <= today) {
    const k = bucketKeyForDay(localDay(d), aggMode);
    if (k !== last) { out.push(k); last = k; }
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function filterByRange(range) {
  if (aggMode === "entries" && range !== "all") {
    const start = rangeStartDataDay(range);
    return start ? records.filter(r => r.day >= start) : []; // no records at all
  }
  const start = rangeStartDay(range);
  return records.filter(r => !start || r.day >= start);
}

const speedLabel = m => ({ output: "Output tps", prompt: "Prefill tps", cache: "Cache Hit %", ot: "Output time %" }[m]);

// Tokens-per-second: sum tokens and sum ms first, then divide (not an average of per-request tps)
// Prefill tps counts only non-cached input tokens; output tps counts output tokens.
function speedTokens(r, m)  { return m === "output" ? r.output : r.input; }
function speedMs(r, m)      { return m === "output" ? r.outputMs : r.promptMs; }

function aggregateSpeedByDay(recs, m, bucketList) {
  const perDay = {};
  const detail = {};
  for (const r of recs) {
    const k = bucketKeyForDay(r.day, aggMode);
    const cell = perDay[k] || (perDay[k] = { tok: 0, ms: 0, cc: 0, ct: 0, os: 0, tms: 0 });
    cell.tok += speedTokens(r, m);
    cell.ms  += speedMs(r, m);
    cell.cc  += r.cached;
    cell.ct  += r.cached + r.input;
    cell.os  += r.outputMs;
    cell.tms += r.promptMs + r.outputMs;
    const d = detail[k] || (detail[k] = { ptok: 0, pms: 0, otok: 0, oms: 0, cc: 0, ct: 0, tms: 0 });
    d.ptok += r.input;             d.pms += r.promptMs;
    d.otok += r.output;            d.oms += r.outputMs;
    d.cc   += r.cached;            d.ct  += r.cached + r.input;
    d.tms  += r.promptMs + r.outputMs;
  }
  if (bucketList) for (const d of bucketList) if (!(d in perDay)) perDay[d] = { tok: 0, ms: 0, cc: 0, ct: 0, os: 0, tms: 0 };
  // values come from the FINAL per-day sums (what the bars draw), so maxTotal
  // always matches the tallest bar — no running-average spikes
  const perVal = {};
  let maxTotal = 0;
  for (const day in perDay) {
    const c = perDay[day];
    perVal[day] = m === "cache"
      ? (c.ct ? c.cc / c.ct * 100 : 0)
      : m === "ot"
      ? (c.tms ? c.os / c.tms * 100 : 0)
      : (c.ms ? c.tok / c.ms * 1000 : 0);
    if (perVal[day] > maxTotal) maxTotal = perVal[day];
  }
  return { days: Object.keys(perVal).sort(), perDay: perVal, maxTotal, detail };
}

function aggregateByDay(recs, metric, bucketList) {
  // returns { days: [bucketKey...], perDay: { key: { model: value } }, maxTotal, detail }
  // detail keeps raw sums per bucket+model (cached/input/output, or prefill/output ms
  // for the "time" metric) for the tooltip breakdown
  const timeD = metric === "time";
  const perDay = {};
  const detail = {};
  let maxTotal = 0;
  for (const r of recs) {
    const v = metricOf(r, metric);
    const k = bucketKeyForDay(r.day, aggMode);
    const m = perDay[k] || (perDay[k] = {});
    m[r.model] = (m[r.model] || 0) + v;
    const dm = detail[k] || (detail[k] = {});
    const dc = dm[r.model] || (dm[r.model] = timeD ? { p: 0, o: 0 } : { c: 0, i: 0, o: 0 });
    if (timeD) { dc.p += r.promptMs; dc.o += r.outputMs; }
    else       { dc.c += r.cached; dc.i += r.input; dc.o += r.output; }
    let tot = 0;
    for (const bk in m) tot += m[bk];
    if (tot > maxTotal) maxTotal = tot;
  }
  if (bucketList) for (const d of bucketList) if (!(d in perDay)) perDay[d] = {};
  let days;
  if (bucketList) {
    days = bucketList.slice();
    for (const d in perDay) if (!days.includes(d)) days.push(d);
    days.sort();
  } else days = Object.keys(perDay).sort();
  return { days, perDay, maxTotal, detail };
}

function aggregateByModel(recs, metric) {
  const perModel = {};
  // per-model raw sums (cached/input/output, or prefill/output ms for "time") for tooltips
  const timeM = metric === "time";
  const detail = {};
  for (const r of recs) {
    perModel[r.model] = (perModel[r.model] || 0) + metricOf(r, metric);
    const d = detail[r.model] || (detail[r.model] = timeM ? { p: 0, o: 0 } : { c: 0, i: 0, o: 0 });
    if (timeM) { d.p += r.promptMs; d.o += r.outputMs; }
    else       { d.c += r.cached; d.i += r.input; d.o += r.output; }
  }
  return { perModel, detail };
}

/* ---------- formatting ---------- */
function compact(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

/* ---------- tooltip ---------- */
const tooltip = document.getElementById("tooltip");

const METRIC_TIPS = {
  tokens:   "cached + input + output tokens",
  output:   "output tokens generated",
  requests: "number of requests",
  time:     "total prefill + output time",
  luna:
    '<div class="tt-text">Luna6 price per MTok</div>' +
    '<div class="tt-grid" style="margin-top:8px">' +
    '<span class="lbl">cached</span><span class="val">$' + LUNA.cached.toFixed(2) + '</span>' +
    '<span class="lbl">input</span><span class="val">$' + LUNA.input.toFixed(2) + '</span>' +
    '<span class="lbl">output</span><span class="val">$' + LUNA.output.toFixed(2) + '</span>' +
    '</div>'
};

// Bar tooltip: per-model breakdown for one day
function showBarTooltip(e, day, metric) {
  const perDay = current.perDay[day];
  const modelTotals = {};
  let total = 0;
  for (const m of models) {
    const v = perDay[m] || 0;
    modelTotals[m] = v;
    total += v;
  }
  const sorted = models.slice().sort((a, b) => modelTotals[b] - modelTotals[a]);
  let html = '<div class="tt-title">' + bucketTitle(day) + " — " + metricLabel(metric) + "</div>";

  // Tokens / Luna metrics: split each model's total into cached / input / output
  if (current.detail && (metric === "tokens" || metric === "luna")) {
    const money = metric === "luna";
    const d = current.detail[day] || {};
    for (const m of sorted) {
      const c = d[m] || { c: 0, i: 0, o: 0 };
      html += '<div class="tt-row"><span><span class="tt-dot" style="background:' + modelColor[m] + '"></span>' +
        m + '</span><span>' + fmtValue(metric, modelTotals[m]) + '</span></div>' +
        '<div class="tt-detail">' +
        (money
          ? '<span class="tt-cell">cached $' + (c.c * LUNA.cached / MTOK).toFixed(4) + '</span>' +
            '<span class="tt-cell">input $' + (c.i * LUNA.input / MTOK).toFixed(4) + '</span>' +
            '<span class="tt-cell">output $' + (c.o * LUNA.output / MTOK).toFixed(4) + '</span>'
          : '<span class="tt-cell">cached ' + fmt(c.c) + '</span>' +
            '<span class="tt-cell">input ' + fmt(c.i) + '</span>' +
            '<span class="tt-cell">output ' + fmt(c.o) + '</span>') +
        '</div>';
    }
  } else if (current.detail && metric === "time") {
    // Time metric: per-model prefill / output / output-% breakdown
    const d = current.detail[day] || {};
    for (const m of sorted) {
      const c = d[m] || { p: 0, o: 0 };
      html += '<div class="tt-row"><span><span class="tt-dot" style="background:' + modelColor[m] + '"></span>' +
        m + '</span><span>' + fmtValue(metric, modelTotals[m]) + '</span></div>' +
        '<div class="tt-detail">' +
        '<span class="tt-cell">prefill ' + fmtHms(c.p) + '</span>' +
        '<span class="tt-cell">output ' + fmtHms(c.o) + '</span>' +
        '<span class="tt-cell">output ' + ((c.p + c.o) ? (c.o / (c.p + c.o) * 100).toFixed(1) : "0.0") + '%</span>' +
        '</div>';
    }
  } else {
    for (const m of sorted) {
      html += '<div class="tt-row"><span><span class="tt-dot" style="background:' + modelColor[m] + '"></span>' +
        m + "</span><span>" + fmtValue(metric, modelTotals[m]) + "</span></div>";
    }
  }
  html += '<div class="tt-row tt-total"><span>Total</span><span>' + fmtValue(metric, total) + "</span></div>";
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(e);
}

// Simple text tooltip for metric buttons
function showTip(e, title, text) {
  tooltip.innerHTML = '<div class="tt-title">' + title + '</div><div class="tt-text">' + text + '</div>';
  tooltip.style.display = "block";
  moveTooltip(e);
}

function hideTooltip() {
  tooltip.style.display = "none";
}

function wireTooltip(el, title, text) {
  el.addEventListener("mouseenter", e => showTip(e, title, text));
  el.addEventListener("mousemove", moveTooltip);
  el.addEventListener("mouseleave", hideTooltip);
}

function moveTooltip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

/* ---------- render ---------- */
let current = { days: [], perDay: {}, maxTotal: 0, metric: "tokens", range: "7" };

function colorFor(i) {
  return MODEL_COLORS[i % MODEL_COLORS.length] || FALLBACK_COLOR;
}

function render() {
  const range = document.getElementById("rangeSel").value;

  models = records.map(r => r.model);
  const uniq = [...new Set(models)];
  models = uniq;
  modelColor = {};
  uniq.forEach((m, i) => modelColor[m] = colorFor(i));

  const recs = filterByRange(range);
  const bucketList = bucketListForRange(range);
  const agg = aggregateByDay(recs, metric, bucketList);
  const modelAgg = aggregateByModel(recs, metric);

  // keep the selected speed model, but (re)default to the top model in the
  // right-panel list when nothing is selected or it's no longer in range
  if (!speedModel || !modelAgg.perModel[speedModel]) {
    const top = models.slice()
      .sort((a, b) => (modelAgg.perModel[b] || 0) - (modelAgg.perModel[a] || 0))[0];
    speedModel = top && (modelAgg.perModel[top] || 0) > 0 ? top : null;
  }

  current = { ...agg, metric };   // range available on demand via rangeSel

  // subtitle: plain first-to-last date of the in-range data
  let minDate = "", maxDate = "";  // full "YYYY-MM-DD HH:..." so HH:00 sorts below HH:30
  for (const r of recs) {
    if (!minDate || r.date < minDate) minDate = r.date;
    if (!maxDate || r.date > maxDate) maxDate = r.date;
  }
  document.getElementById("subtitle").textContent =
    recs.length
      ? shortDay(dayKey(minDate)) + " — " + shortDay(dayKey(maxDate)) + "  ·  " + fmt(recs.length) + " requests in range"
      : "no data in range";

  renderChart(agg, metric);
  renderSummary(modelAgg.perModel, modelAgg.detail, metric);
  renderCacheLine(recs);
  renderSpeedPanel(recs);
}

// Rebuilds only the speed section (after a model is picked) without
// re-running renderSummary() — that would rebuild the right-panel rows
// and steal focus from the model dropdown.
function renderSpeedPanel(recs) {
  speedRecs = speedModel ? recs.filter(r => r.model === speedModel) : [];
  updateSpeedControls();
  renderSpeedChart();
}

function updateSpeedControls() {
  const sel = document.getElementById("speedModelSel");
  if (sel.value !== (speedModel || "")) sel.value = speedModel || "";
  for (const b of document.querySelectorAll("#speedBtns button")) {
    b.classList.toggle("active", b.dataset.speed === speedMetric);
  }
}

function renderSpeedChart() {
  const bars = document.getElementById("speedBars");
  const yAxis = document.getElementById("speedYAxis");
  const xLabels = document.getElementById("speedXLabels");
  const region = bars.parentElement;
  bars.innerHTML = "";
  xLabels.innerHTML = "";
  yAxis.innerHTML = "";

  // sync model dropdown
  const sel = document.getElementById("speedModelSel");
  sel.innerHTML = '<option value="">Select a model…</option>' +
    models.map(m => '<option value="' + m + '">' + m + "</option>").join("");
  sel.value = speedModel || "";

  // sync which model row is highlighted
  for (const row of document.querySelectorAll(".model-row")) {
    row.classList.toggle("selected", row.dataset.model === speedModel);
  }

  if (!speedModel) {
    const d = document.createElement("div");
    d.className = "empty";
    d.style.cssText = "display:flex;align-items:center;justify-content:center;width:100%;height:100%";
    d.textContent = "Click a model on the right (or use the dropdown) to see its performance";
    bars.appendChild(d);
    return;
  }

  const bucketList = bucketListForRange(document.getElementById("rangeSel").value);
  const agg = aggregateSpeedByDay(speedRecs, speedMetric, bucketList);
  const { days, perDay, maxTotal, detail: spdDetail } = agg;
  const speedLabelMap = buildAxisLabels(days);
  const isRatio = speedMetric === "cache" || speedMetric === "ot";
  // tps axes: round the max bar up to a clean step (20 for output, 200 for prefill)
  const step = speedMetric === "prompt" ? 200 : 20;
  const top = isRatio ? 100 : Math.max(step, Math.ceil(maxTotal / step) * step);
  const col = modelColor[speedModel] || FALLBACK_COLOR;
  // same 1px gap for dense (yearly) ranges so 365 bars fit — see renderChart
  const gap = days.length > 60 ? "1px" : "4px";
  bars.style.gap = gap;
  xLabels.style.gap = gap;

  const ticks = 5;
  for (let i = ticks; i >= 0; i--) {
    const el = document.createElement("div");
    el.textContent = isRatio
      ? Math.round(top * i / ticks) + "%"
      : Math.round(top * i / ticks) + " tps";
    yAxis.appendChild(el);
  }

  let grid = region.querySelector(".grid-lines");
  if (!grid) { grid = document.createElement("div"); grid.className = "grid-lines"; region.insertBefore(grid, bars); }
  grid.innerHTML = "";
  for (let i = 1; i <= ticks; i++) {
    const line = document.createElement("div");
    line.className = "grid-line";
    line.style.top = ((ticks - i) / ticks * 100) + "%";
    grid.appendChild(line);
  }

  if (!days.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.style.cssText = "display:flex;align-items:center;justify-content:center;width:100%;height:100%";
    d.textContent = "No data in range";
    bars.appendChild(d);
    return;
  }

  for (const day of days) {
    const group = document.createElement("div");
    group.className = "bar-group";

    const segGroup = document.createElement("div");
    segGroup.className = "bar-seg-group";

    const v = perDay[day] || 0;
    const segStack = document.createElement("div");
    segStack.style.height = (v / top * 100) + "%";
    segStack.style.background = col;
    segStack.style.width = "100%";
    segGroup.appendChild(segStack);

    segGroup.addEventListener("mouseenter", e => showSpeedDayTooltip(e, day, speedMetric, spdDetail[day]));
    segGroup.addEventListener("mousemove", moveTooltip);
    segGroup.addEventListener("mouseleave", hideTooltip);

    const label = document.createElement("div");
    label.className = "x-label";
    label.textContent = speedLabelMap[day] || "";

    group.appendChild(segGroup);
    bars.appendChild(group);
    xLabels.appendChild(label);
  }
}

function fmtHms(ms) {
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h > 0) return h + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s";
  if (m > 0) return m + "m " + String(s).padStart(2, "0") + "s";
  return s + "s";
}

function showSpeedDayTooltip(e, day, m, d) {
  const p = d || { ptok: 0, pms: 0, otok: 0, oms: 0, cc: 0, ct: 0, tms: 0 };
  const pTps = p.pms ? p.ptok / p.pms * 1000 : 0;
  const oTps = p.oms ? p.otok / p.oms * 1000 : 0;
  const pct  = p.ct ? p.cc / p.ct * 100 : 0;
  const otPct = p.tms ? p.oms / p.tms * 100 : 0;
  const html =
    '<div class="tt-title">' + bucketTitle(day) + " — " + speedLabel(m) + "</div>" +
    '<div class="tt-grid">' +
    (m === "cache"
      ? '<span class="lbl">cached</span><span class="val">' + fmt(p.cc) + '</span>' +
        '<span class="lbl">cached + input</span><span class="val">' + fmt(p.ct) + '</span>' +
        '<span class="lbl">cache hit</span><span class="val">' + pct.toFixed(1) + "%</span>"
      : m === "ot"
      ? '<span class="lbl">output time</span><span class="val">' + fmtHms(p.oms) + '</span>' +
        '<span class="lbl">total time</span><span class="val">' + fmtHms(p.tms) + '</span>' +
        '<span class="lbl">output share</span><span class="val">' + otPct.toFixed(1) + "%</span>"
      : m === "output"
      ? '<span class="lbl">tokens</span><span class="val">' + fmt(p.otok) + '</span>' +
        '<span class="lbl">time</span><span class="val">' + fmtHms(p.oms) + '</span>' +
        '<span class="lbl">tps</span><span class="val">' + oTps.toFixed(1) + '</span>'
      : '<span class="lbl">tokens</span><span class="val">' + fmt(p.ptok) + '</span>' +
        '<span class="lbl">time</span><span class="val">' + fmtHms(p.pms) + '</span>' +
        '<span class="lbl">tps</span><span class="val">' + pTps.toFixed(1) + '</span>') +
    '</div>';
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(e);
}

function renderChart(agg, metric) {
  const { days, perDay, maxTotal } = agg;
  const bars = document.getElementById("bars");
  const yAxis = document.getElementById("yAxis");
  const region = bars.parentElement;
  // round the axis top up to clean steps: ×20 for requests, ×$0.05 for luna
  let top;
  if (metric === "requests") top = Math.max(20, Math.ceil((maxTotal || 1) / 20) * 20);
  else if (metric === "luna") top = Number((Math.ceil((maxTotal || 1) / 0.05) * 0.05).toFixed(2));
  else if (metric === "time") {
    // 6 ticks (step = top/5): top = multiple of 25 min so every tick lands
    // on a 5-minute step
    top = Math.ceil((maxTotal || 300000) / 1500000) * 1500000;
  }
  else top = maxTotal || 1;

  document.getElementById("chartTitle").textContent = aggTitle() + " " + metricLabel(metric);

  // y axis ticks (6 labels, top → 0)
  const ticks = 5;
  yAxis.innerHTML = "";
  for (let i = ticks; i >= 0; i--) {
    const el = document.createElement("div");
    el.textContent = compactValue(metric, top * i / ticks, top);
    yAxis.appendChild(el);
  }

  // faint gridlines at each tick height (skip the bottom line — it sits on the axis border)
  let grid = region.querySelector(".grid-lines");
  if (!grid) { grid = document.createElement("div"); grid.className = "grid-lines"; region.insertBefore(grid, bars); }
  grid.innerHTML = "";
  for (let i = 1; i <= ticks; i++) {
    const line = document.createElement("div");
    line.className = "grid-line";
    line.style.top = ((ticks - i) / ticks * 100) + "%";
    grid.appendChild(line);
  }

  const labelMap = buildAxisLabels(days);

  const xLabels = document.getElementById("xLabels");
  // dense ranges (yearly) get a 1px gap — fixed gaps can't shrink with flex,
  // and 365 × 4px would overflow the plot on its own
  const gap = days.length > 60 ? "1px" : "4px";
  bars.style.gap = gap;
  xLabels.style.gap = gap;

  bars.innerHTML = "";
  xLabels.innerHTML = "";
  if (!days.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.style.cssText = "display:flex;align-items:center;justify-content:center;width:100%;height:100%";
    d.textContent = "No data in the selected range";
    bars.appendChild(d);
    return;
  }

  for (const day of days) {
    const group = document.createElement("div");
    group.className = "bar-group";

    const stack = document.createElement("div");
    stack.className = "bar-stack";

    let total = 0;
    for (const m of models) {
      const v = perDay[day][m] || 0;
      if (!v) continue;
      total += v;
      const seg = document.createElement("div");
      seg.className = "bar-seg";
      seg.style.height = (v / top * 100) + "%";
      seg.style.background = modelColor[m];
      stack.appendChild(seg);
    }
    if (total === 0) {
      const seg = document.createElement("div");
      seg.className = "bar-seg";
      seg.style.height = "0%";
      stack.appendChild(seg);
    }

    stack.addEventListener("mouseenter", e => showBarTooltip(e, day, metric));
    stack.addEventListener("mousemove", moveTooltip);
    stack.addEventListener("mouseleave", hideTooltip);

    const label = document.createElement("div");
    label.className = "x-label";
    label.textContent = labelMap[day] || "";

    group.appendChild(stack);
    bars.appendChild(group);
    xLabels.appendChild(label);
  }
}

function renderSummary(perModel, detail, metric) {
  const list = document.getElementById("modelList");
  const total = models.reduce((a, m) => a + (perModel[m] || 0), 0);

  document.getElementById("summaryTitle").textContent =
    metricLabel(metric) + " by model";

  const sorted = models.slice().sort((a, b) => (perModel[b] || 0) - (perModel[a] || 0));
  const maxV = sorted.length ? (perModel[sorted[0]] || 0) : 0;

  list.innerHTML = sorted.map(m => {
    const v = perModel[m] || 0;
    const pct = total ? (v / total * 100).toFixed(1) : "0.0";
    const w = maxV ? (v / maxV * 100) : 0;
    return '<div class="model-row" data-model="' + m + '">' +
      '<div class="model-row-head">' +
        '<span class="model-name">' + m + "</span>" +
        '<span class="model-value">' + fmtValue(metric, v) + "</span>" +
      "</div>" +
      '<div class="model-bar-track"><div class="model-bar-fill" style="width:' + w + '%;background:' + modelColor[m] + '"></div></div>' +
      '<div class="model-sub">' + pct + "% of total</div>" +
    "</div>";
  }).join("") || '<div class="empty">No data in range</div>';

  // cached / input / output breakdown on hover for tokens & luna;
  // prefill / output / output-% for time
  const showBreakdown = detail && (metric === "tokens" || metric === "luna" || metric === "time");
  for (const row of list.querySelectorAll(".model-row")) {
    const m = row.dataset.model;
    if (showBreakdown) {
      if (metric === "time") {
        const c = detail[m] || { p: 0, o: 0 };
        const share = (c.p + c.o) ? c.o / (c.p + c.o) * 100 : 0;
        const grid =
          '<span class="lbl">prefill</span><span class="val">' + fmtHms(c.p) + '</span>' +
          '<span class="lbl">output</span><span class="val">' + fmtHms(c.o) + '</span>' +
          '<span class="lbl">output share</span><span class="val">' + share.toFixed(1) + "%</span>";
        wireTooltip(row, m, '<div class="tt-grid">' + grid + '</div>');
        continue;
      }
      const c = detail[m] || { c: 0, i: 0, o: 0 };
      // each sub category on its own line; total is already shown in the row
      const vals = metric === "luna"
        ? ["$" + (c.c * LUNA.cached / MTOK).toFixed(4),
           "$" + (c.i * LUNA.input / MTOK).toFixed(4),
           "$" + (c.o * LUNA.output / MTOK).toFixed(4)]
        : [fmt(c.c), fmt(c.i), fmt(c.o)];
      let grid = ['cached', 'input', 'output'].map((lbl, i) =>
        '<span class="lbl">' + lbl + '</span><span class="val">' + vals[i] + '</span>'
      ).join('');
      // tokens metric: also show this model's cache hit rate
      if (metric === "tokens") {
        const t = c.c + c.i;
        const pct = t ? c.c / t * 100 : 0;
        grid += '<span class="lbl">cache hit</span><span class="val">' + pct.toFixed(1) + "%</span>";
      }
      wireTooltip(row, m, '<div class="tt-grid">' + grid + '</div>');
    } else {
      wireTooltip(row, m, "<span>" + fmtValue(metric, perModel[m] || 0) + "</span>");
    }
    row.addEventListener("click", () => selectSpeedModel(m));
  }

  const gt = document.getElementById("grandTotal");
  gt.hidden = !total;
  document.getElementById("grandValue").textContent = fmtValue(metric, total);
}

// Cache Hit % for the whole range (sum cached and cached+input first, then divide).
// Only shown while the Tokens metric is active.
function renderCacheLine(recs) {
  const line = document.getElementById("cacheLine");
  if (metric !== "tokens") { line.hidden = true; return; }
  let c = 0, t = 0;
  for (const r of recs) { c += r.cached; t += r.cached + r.input; }
  if (!t) { line.hidden = true; return; }
  const pct = c / t * 100;
  line.hidden = false;
  document.getElementById("cacheValue").textContent = pct.toFixed(1) + "%";
  wireTooltip(line, "Cache Hit %", '<div class="tt-grid">' +
    '<span class="lbl">cached tokens</span><span class="val">' + fmt(c) + '</span>' +
    '<span class="lbl">cached + input</span><span class="val">' + fmt(t) + '</span>' +
    '<span class="lbl">cache hit</span><span class="val">' + pct.toFixed(1) + "%</span></div>");
}

// Picking a model (by clicking its row, or via the dropdown) re-renders
// only the speed section, not the summary — see renderSpeedPanel().
function selectSpeedModel(m) {
  speedModel = m;
  const sel = document.getElementById("speedModelSel");
  if (sel.value !== m) sel.value = m;
  renderSpeedPanel(filterByRange(document.getElementById("rangeSel").value));
}

/* ---------- wiring ---------- */
// Sensible default suggestions when the range changes (e.g. 7 days with a
// weekly aggregation would be a single bar). The user can still pick any
// mode manually afterwards.
function autoAdjustAgg(range) {
  if ((range === "7" && (aggMode === "weekly" || aggMode === "monthly"))
      || (range === "30" && aggMode === "monthly")
      || (range === "365" && aggMode === "daily")) {
    aggMode = range === "365" ? "weekly" : "daily";
    aggSel.value = aggMode;
  }
}

document.getElementById("rangeSel").addEventListener("change", () => {
  autoAdjustAgg(document.getElementById("rangeSel").value);
  render();
});

wireTooltip(document.getElementById("rangeSel"), "Range",
  "Last 7 Days / Last 30 Days / Last Year: calendar days ending today.<br>" +
  "Total: everything in the data file.<br>" +
  '<span style="color:var(--text-dim)">Aggregation is suggested automatically for some ranges; you can switch back at any time.</span>');

const aggSel = document.getElementById("aggSel");
wireTooltip(aggSel, "Aggregation",
  "Daily: one bar per calendar day (empty bars for gaps).<br>" +
  "Weekly: bars summed per ISO week (Mon–Sun).<br>" +
  "Monthly: bars summed per calendar month.<br>" +
  "Days with entry: only the X most recent days that have requests — no gaps.<br>" +
  '<span style="color:var(--text-dim)">Suggested automatically for some ranges; you can switch back at any time.</span>');
const rangeSelEl = document.getElementById("rangeSel");
aggSel.addEventListener("change", () => {
  aggMode = aggSel.value;
  // monthly with a short range would be a single bar — widen the range too
  if (aggMode === "monthly" && ["7", "30"].includes(rangeSelEl.value)) {
    rangeSelEl.value = "365";
  }
  render();
});

// styled tooltips on metric buttons
for (const b of document.querySelectorAll("#metricBtns button")) {
  wireTooltip(b, metricLabel(b.dataset.metric), METRIC_TIPS[b.dataset.metric] || "");
}

// tooltips on the speed panel's ratio mode buttons
const cacheSpeedBtn = document.querySelector('#speedBtns button[data-speed="cache"]');
if (cacheSpeedBtn) {
  wireTooltip(cacheSpeedBtn, "Cache Hit %", "cached / (cached + input)<br>summed per group before dividing");
}
const otSpeedBtn = document.querySelector('#speedBtns button[data-speed="ot"]');
if (otSpeedBtn) {
  wireTooltip(otSpeedBtn, "Output time %", "output time / total time<br>summed per group before dividing");
}

document.getElementById("metricBtns").addEventListener("click", e => {
  const btn = e.target.closest("button[data-metric]");
  if (!btn || btn.classList.contains("active")) return;
  for (const b of document.querySelectorAll("#metricBtns button")) b.classList.remove("active");
  btn.classList.add("active");
  metric = btn.dataset.metric;
  render();
});

document.getElementById("speedModelSel").addEventListener("change", e => {
  speedModel = e.target.value || null;
  renderSpeedPanel(filterByRange(document.getElementById("rangeSel").value));
});

document.getElementById("speedBtns").addEventListener("click", e => {
  const btn = e.target.closest("button[data-speed]");
  if (!btn || btn.classList.contains("active")) return;
  for (const b of document.querySelectorAll("#speedBtns button")) b.classList.remove("active");
  btn.classList.add("active");
  speedMetric = btn.dataset.speed;
  renderSpeedPanel(filterByRange(document.getElementById("rangeSel").value));
});

loadData();
</script>
</body>
</html>
