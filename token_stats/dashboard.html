<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Stats Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<h1><span>Token Stats <small id="subtitle">loading…</small></span><span id="status"></span></h1>

<div class="controls">
  <div class="control-group">
    <select id="rangeSel">
      <option value="7">Last 7 Days</option>
      <option value="30" selected>Last 30 Days</option>
      <option value="90">Last 90 Days</option>
      <option value="365">Last Year</option>
      <option value="all">Total</option>
    </select>
  </div>
  <div class="control-group">
    <select id="aggSel">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="entries">Days with entry</option>
    </select>
  </div>
  <div class="control-group">
    <div class="btn-group" id="metricBtns" role="group" aria-label="Metric">
      <button type="button" class="active" data-metric="tokens">Tokens</button>
      <button type="button" data-metric="outputs">Output</button>
      <button type="button" data-metric="requests">Requests</button>
      <button type="button" data-metric="time">Time</button>
      <button type="button" data-metric="luna">Luna equiv. $</button>
      <button type="button" data-metric="electric">Electricity €</button>
    </div>
  </div>
  <div class="control-group">
    <div class="btn-group" id="speedBtns" role="group" aria-label="Speed metric">
      <button type="button" data-speed="output">Output tps</button>
      <button type="button" data-speed="prompt">Input tps</button>
      <button type="button" data-speed="cache">Cache Hit %</button>
      <button type="button" data-speed="ot">Output time %</button>
    </div>
  </div>
  <div class="control-group">
    <button type="button" id="groupBtn" class="toggle-btn">Group variants</button>
  </div>
  <div class="control-group">
    <label for="minReqSel">Min requests</label>
    <input id="minReqSel" type="number" min="0" step="1" value="0">
  </div>
  <div class="control-group">
    <select id="speedModelSel"></select>
  </div>
</div>

<div class="main">
  <div class="panel chart-panel">
    <div class="panel-title" id="chartTitle">Daily Usage</div>
    <div class="chart-area">
      <div class="y-axis" id="yAxis"></div>
      <div class="bar-region">
        <div class="plot-wrap">
          <div class="bars" id="bars"></div>
        </div>
        <div class="x-labels" id="xLabels"></div>
      </div>
    </div>
  </div>

  <div class="panel summary-panel">
    <div class="panel-title" id="summaryTitle">Per Model</div>
    <div id="modelList"></div>
    <div class="grand-total" id="grandTotal" hidden>
      <span>Total</span><b id="grandValue"></b>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="dashboard.js"></script>
</body>
</html>
